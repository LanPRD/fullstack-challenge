name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format check (all workspaces in parallel steps)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint — games
        run: bun run lint
        working-directory: services/games

      - name: Lint — wallets
        run: bun run lint
        working-directory: services/wallets

      - name: Lint — frontend
        run: bun run lint
        working-directory: frontend

      - name: Format — games
        run: bun run prettier:check
        working-directory: services/games

      - name: Format — wallets
        run: bun run prettier:check
        working-directory: services/wallets

      - name: Format — frontend
        run: bun run prettier:check
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Type check (games and wallets run in parallel via matrix)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [games, wallets]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: services/${{ matrix.service }}

      - name: Typecheck
        run: bun run typecheck
        working-directory: services/${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Unit tests (games and wallets run in parallel via matrix)
  # ---------------------------------------------------------------------------
  unit:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [games, wallets]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Unit tests
        run: bun test tests/unit
        working-directory: services/${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Frontend build (includes tsc type check via "tsc -b && vite build")
  # ---------------------------------------------------------------------------
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # E2E tests — Wallets Service
  # Requires PostgreSQL; RabbitMQ and JWT are mocked in the test setup.
  # ---------------------------------------------------------------------------
  e2e-wallets:
    name: E2E Tests (wallets)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, build]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: services/wallets

      - name: E2E tests
        run: bun run test:e2e
        working-directory: services/wallets
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/postgres?schema=public
          PORT: "4002"
          RABBITMQ_URL: amqp://admin:admin@localhost:5672
          JWT_JWKS_URI: http://localhost:8080/realms/wallets/protocol/openid-connect/certs
          JWT_ISSUER: http://localhost:8080/realms/wallets

  # ---------------------------------------------------------------------------
  # E2E tests — Games Service
  # Requires PostgreSQL; RabbitMQ and Keycloak are mocked in the test setup.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests (games)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, build]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: services/games

      - name: E2E tests
        run: bun run test:e2e
        working-directory: services/games
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/postgres?schema=public
          PORT: "4001"
          RABBITMQ_URL: amqp://admin:admin@localhost:5672
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: crash-game
          KEYCLOAK_CLIENT_ID: crash-game-client
          JWT_JWKS_URI: http://localhost:8080/realms/crash-game/protocol/openid-connect/certs
          JWT_ISSUER: http://localhost:8080/realms/crash-game
          BETTING_PHASE_DURATION_MS: "10000"
